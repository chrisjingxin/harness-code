name: OpenWiki User Guide Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.1.2

      - name: Update user guide
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.3-flash
          LANGCHAIN_OPENAI_STREAM_CHUNK_TIMEOUT_S: "600"

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: openwiki
          branch: openwiki/update-user-guide
          commit-message: "docs: update OpenWiki user guide"
          title: "docs: update OpenWiki user guide"
          body: "OpenWiki user guide update."
