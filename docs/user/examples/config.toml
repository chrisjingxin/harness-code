# Harness Code 用户级 TOML v1 模板。
# 将此文件复制到 ~/.harness/config.toml；不要提交 API Key、Token 或认证 Header。

[config]
version = 1

# 可声明多个命名 OpenAI-compatible Profile；default_profile 是未选择模型时的回退项。
[models]
default_profile = "fast"

[models.profiles.fast]
provider = "openai-compatible"
provider_label = "Enterprise Fast"
model = "your-enterprise-coding-model"
base_url = "https://gateway.example.internal/v1"
api_key_env = "HARNESS_API_KEY"
# 仅当上述环境变量缺失或空白时使用。推荐保留环境变量方式。
# Harness 首次加载时会自动收紧用户级文件权限为 600，且不得把该文件提交到仓库。
# api_key = "your-enterprise-gateway-key"
timeout_seconds = 120
max_retries = 2
# 模型输入窗口；未填写时使用 128000。显式值不得低于 16384。
context_window_tokens = 128000
# 未声明时兼容 tool-calling、streaming；可选 vision。
capabilities = ["tool-calling", "streaming"]
# 可选的 Chat Completions reasoning effort；不展示 raw reasoning，也不会切换到 Responses。
# [models.profiles.fast.reasoning]
# effort = "medium"

# 固定 Header 只能包含非秘密值；Authorization、Cookie 和 API Key 必须放入 headers_env。
[models.profiles.fast.headers]
X-Client-Name = "harness-code"

[models.profiles.fast.headers_env]
X-Enterprise-Tenant = "HARNESS_TENANT"

# 可选的更强 Profile。空闲 Thread 中 /model pro 会让下一次 Run 使用它；
# 不会修改 TOML，也不会热切换已经开始的 Run。
# [models.profiles.pro]
# provider = "openai-compatible"
# provider_label = "Enterprise Pro"
# model = "your-enterprise-pro-model"
# base_url = "https://gateway.example.internal/v1"
# api_key_env = "HARNESS_PRO_API_KEY"
# context_window_tokens = 256000
# capabilities = ["tool-calling", "streaming", "vision"]
#
# 当前 Single Agent 实际使用 executor；其余角色会随 Thread 冻结，供未来 topology 使用。
# [models.roles]
# planner = "pro"
# executor = "fast"
#
# 实验性子代理模型绑定，默认关闭；与 [models.roles] 不是同一入口。
# 修改后重启 sidecar，对下一次 Run 生效。
# [experimental.delegation]
# enabled = false
# [experimental.delegation.models]
# explore = "fast"

[approval]
mode = "auto"
# AUTO 模式 F4 层两阶段 LLM 安全分类器使用的 Profile id，
# 填写 [models.profiles] 中实际存在的项；这里默认复用 fast。
# 未配置或解析失败时 F4 回退人工审批（fail-closed），不会自动放行。
classifier = "fast"

[execution]
backend = "local"

# Sidecar 内共享 AgentRuntime 的有界缓存。相同稳定配置的多个 thread 复用一张图；
# 淘汰只会释放内存中的图和连接，不会删除 SQLite 中的消息、PromptEpoch 或 checkpoint。
[runtime_pool]
# 同时缓存的 Runtime Profile 数，范围 1-64。
max_profiles = 8
# 空闲 Runtime 的淘汰等待时间，范围 60-86400 秒。
idle_ttl_seconds = 1800
# sidecar 退出时单个 Runtime 等待资源关闭的时间，范围 1-120 秒。
close_timeout_seconds = 15
# true 时默认 Profile 不参与 LRU/TTL 淘汰；只建议固定的单项目交互环境使用。
pin_default_profile = false

# 本地结构化诊断日志配置。
# 环境变量 HARNESS_LOG_LEVEL 可临时覆盖 level；重启 sidecar 生效。
[diagnostics]
# 日志级别：可选 "debug" | "info" | "warn" | "error"，默认为 "info"
level = "info"
# 历史日志保留天数（默认 14 天）
retention_days = 14
# 日志目录总容量上限（单位 MiB，默认 200）
max_total_mib = 200
# 单个日志文件分片容量上限（单位 MiB，默认 16，不得大于 max_total_mib）
max_file_mib = 16

# Build `/goal` 的独立验收。省略 grader_model 时继承该次 Run 的实际主模型。
# 环境变量 HARNESS_GOAL_GRADER_MODEL / HARNESS_GOAL_MAX_ITERATIONS 可覆盖。
[goal]
# grader_model = "pro"
max_iterations = 3


