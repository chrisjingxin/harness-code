<div class="app" id="app">
  <!-- 第一层：56px 固定全局图标栏 -->
  <aside class="lf-rail" id="lfRail" aria-label="全局业务导航"></aside>

  <!-- 第二层：304px 悬浮卡片式次级侧栏（工作台会话树 / 管理导航，宽屏页自动隐藏） -->
  <aside class="lf-sidebar" id="sidebar" aria-label="工作台次级导航"></aside>

  <!-- 第三层：主工作区（顶栏 + 中央舞台 + 右侧工具栏） -->
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn side-toggle" id="sideToggle" data-act="side-toggle" aria-pressed="true" aria-label="收起次级侧栏" title="收起 / 展开次级侧栏 (⌘\)"></button>
      <button type="button" class="icon-btn menu-btn" data-act="drawer" aria-label="打开导航" id="drawerBtn"></button>
      <button type="button" class="icon-btn" data-act="back-home" id="backHomeBtn" hidden aria-label="返回"></button>
      <div class="tb-title" id="tbTitle"></div>
      <div class="tb-spacer"></div>
      <div class="tb-collab" id="tbCollab"></div>
      <div class="tb-right" id="tbRight"></div>
    </header>

    <div class="content">
      <main class="stage" id="stage" tabindex="-1"></main>
      <aside class="rail" id="rail" aria-label="本机工作区与产物"></aside>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden data-act="drawer-close"></div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="popover" id="popover" role="dialog" aria-label="协作成员与队友会话" hidden></div>
<div class="popover user-popover" id="userPopover" role="dialog" aria-label="账号与外观设置" hidden></div>
<div class="palette-wrap" id="palette" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 新建 Project -->
<dialog id="dlgProject" aria-labelledby="dlgProjectTitle">
  <form class="dlg" id="formProject" novalidate>
    <div class="dlg-head">
      <div class="od-stack" style="--od-gap:2px">
        <h2 id="dlgProjectTitle">新建 Project</h2>
        <p class="dlg-sub" id="dlgProjectSub"></p>
      </div>
      <button type="button" class="icon-btn" data-act="dlg-close" data-dlg="dlgProject" aria-label="关闭" style="margin-left:auto"><svg class="od-icon" style="--od-icon-size:15px" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="fld">
        <label for="projName">项目名称<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="projName" name="projName" autocomplete="off" placeholder="例如：结账台拆分支付重构" required>
        <p class="err" id="projNameErr" hidden></p>
      </div>
      <div class="fld">
        <label for="projDesc">项目说明</label>
        <textarea id="projDesc" name="projDesc" placeholder="简述项目目标、负责模块或协作边界（可选）"></textarea>
      </div>
      <div class="fld">
        <span id="projMemberLabel" style="font-size:var(--text-sm);font-weight:600">从当前 Workspace 勾选成员</span>
        <p class="help">创建者默认成为 Project 负责人，其他成员仅对勾选的 Project 可见。</p>
        <div id="projMemberList" role="group" aria-labelledby="projMemberLabel"></div>
      </div>
      <div class="fld">
        <label for="projRepo">关联仓库（可选）</label>
        <input type="text" id="projRepo" name="projRepo" autocomplete="off" placeholder="pay/checkout-split">
      </div>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" data-act="dlg-close" data-dlg="dlgProject">取消</button>
      <button type="submit" class="btn btn-primary">创建并进入</button>
    </div>
  </form>
</dialog>

<!-- 在本机开始 Task -->
<dialog id="dlgStart" aria-labelledby="dlgStartTitle">
  <form class="dlg" id="formStart" novalidate>
    <div class="dlg-head">
      <div class="od-stack" style="--od-gap:2px">
        <h2 id="dlgStartTitle">在本机开始</h2>
        <p class="dlg-sub" id="dlgStartSub"></p>
      </div>
      <button type="button" class="icon-btn" data-act="dlg-close" data-dlg="dlgStart" aria-label="关闭" style="margin-left:auto"><svg class="od-icon" style="--od-icon-size:15px" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="fld">
        <span id="startModeLabel" style="font-size:var(--text-sm);font-weight:600">选择执行会话</span>
        <div class="choice-list" id="startModeList" role="radiogroup" aria-labelledby="startModeLabel"></div>
      </div>
      <div class="fld" id="startPickWrap" hidden>
        <label for="startPick">已有会话</label>
        <select id="startPick" class="c4-select"></select>
      </div>
      <div class="fld" id="startNewWrap" hidden>
        <label for="startNewTitle">新会话标题</label>
        <input type="text" id="startNewTitle" autocomplete="off" placeholder="例如：灰度白名单接口补齐">
        <p class="err" id="startNewErr" hidden></p>
      </div>
      <div class="fld" id="startDirWrap">
        <label for="startDir">工作目录</label>
        <input type="text" id="startDir" autocomplete="off">
        <p class="help">只在本机启动 Agent 会话，不会操作他人设备。</p>
      </div>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" data-act="dlg-close" data-dlg="dlgStart">取消</button>
      <button type="submit" class="btn btn-primary">开始执行</button>
    </div>
  </form>
</dialog>

<!-- 派发任务 -->
<dialog id="dlgDispatch" aria-labelledby="dlgDispatchTitle">
  <form class="dlg" id="formDispatch" novalidate>
    <div class="dlg-head">
      <div class="od-stack" style="--od-gap:2px">
        <h2 id="dlgDispatchTitle">@成员 派发任务</h2>
        <p class="dlg-sub" id="dlgDispatchSub"></p>
      </div>
      <button type="button" class="icon-btn" data-act="dlg-close" data-dlg="dlgDispatch" aria-label="关闭" style="margin-left:auto"><svg class="od-icon" style="--od-icon-size:15px" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="fld">
        <label for="disTitle">任务标题<span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="disTitle" autocomplete="off" placeholder="例如：支付方式列表接口补 3 个字段" required>
        <p class="err" id="disTitleErr" hidden></p>
      </div>
      <div class="fld">
        <label for="disTo">指派给</label>
        <select id="disTo" class="c4-select"></select>
      </div>
      <div class="fld">
        <label for="disDesc">背景说明与验收标准</label>
        <textarea id="disDesc" placeholder="为什么需要这个改动、验收标准是什么"></textarea>
      </div>
    </div>
    <div class="dlg-foot">
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" data-act="dlg-close" data-dlg="dlgDispatch">取消</button>
      <button type="submit" class="btn btn-primary">派发任务</button>
    </div>
  </form>
</dialog>

<!-- 通用行程/操作弹窗（知识沉淀、本机记忆、目录配置、诊断详情等） -->
<dialog id="dlgModal" aria-labelledby="dlgModalTitle"></dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
