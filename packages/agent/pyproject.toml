[project]
name = "za38-agent"
version = "0.1.0"
description = "za38 agent kernel — deepagents + LangChain + LangGraph"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents==0.7.3",
    "langchain==1.3.15",
    "langchain-core==1.6.2",
    "langgraph-checkpoint-sqlite==3.0.3",
    "langchain-openai==1.3.3",
    "langchain-mcp-adapters==0.2.1",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.12.5",
    "tomli-w>=1.1.0",
    "websockets==15.0.1",
    "tree-sitter>=0.24.0,<0.27.0",
    "tree-sitter-bash>=0.25.0,<0.26.0",
]

[project.scripts]
harness-agent = "harness_agent.__main__:main"

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_agent"]

[tool.hatch.build.targets.wheel.force-include]
"harness_agent/protocol/protocol_v3.json" = "harness_agent/protocol/protocol_v3.json"
"harness_agent/protocol/protocol_v3.sha256" = "harness_agent/protocol/protocol_v3.sha256"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: requires a loopback-only mock OpenAI server",
    "codegraph_integration: requires local CodeGraph 1.1.6 platform package",
]
