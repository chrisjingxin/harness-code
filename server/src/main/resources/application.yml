spring:
  application:
    name: collaboration-server
  # 依赖已在 classpath 上，但 contracts / init-demo 一次性命令不能去连 Redis 或 Kafka。
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.observation.LettuceObservationAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration
  sql:
    init:
      mode: never
  main:
    banner-mode: off

server:
  address: 127.0.0.1
  port: 18084
  servlet:
    session:
      cookie:
        name: WBSESSION
        http-only: true
        same-site: strict
      timeout: 30m

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 团队交接在同一事务混合 JDBC/Mapper，语句间必须读取最新资格。
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: auto

workbench:
  # 命令行 --workbench.command= 会盖过这里。不带参数时就是普通启动。
  command: start
  origin: http://127.0.0.1:18084
  pool:
    maximum-size: 4
    minimum-idle: 0
    connection-timeout-ms: 3000
    validation-timeout-ms: 1000
    initialization-fail-timeout-ms: 5000
    # 云平台 TCP 连接 240s 强断：三项全部压在阈值内，否则复用被断开的物理连接
    max-lifetime-ms: 200000
    idle-timeout-ms: 180000
    keepalive-time-ms: 120000
  # 默认按 cluster 模式连接 Redis、Kafka 与 ES；无外部中间件的隔离单机冒烟需显式指定 standalone。
  middleware:
    mode: cluster
    node-id: local
    redis:
      host: 127.0.0.1
      port: 6379
    kafka:
      bootstrap-servers: 127.0.0.1:9092
    elasticsearch:
      url: http://127.0.0.1:9200
  notifications:
    external:
      # 全局外部IM出站开关（默认关闭；企业接入自研IM时开启）
      enabled: false
      # 激活的外部通知通道：noop | logging | <企业自定义channelType>
      channel: noop
      dispatch-interval-ms: 2000
      default-merge-window-sec: 60
      max-attempts: 3
